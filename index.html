function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function flash(message) {
  notice.textContent = message;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => notice.textContent = "", 3800);
}
function save() {
  try { localStorage.setItem(key, JSON.stringify(state)); }
  catch { flash("Browser storage is unavailable. Keep this tab open to retain this session."); }
}
function day(offset=0) {
  const now = new Date();
  now.setDate(now.getDate() + offset);
  return [now.getFullYear(), String(now.getMonth()+1).padStart(2,"0"), String(now.getDate()).padStart(2,"0")].join("-");
}
function dayLabel(value) {
  return new Date(value + "T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
const record = id => state.records[id] ?? {status:0};
const targets = () => state.overrides[day()] ?? state.targets;
const due = () => rows.filter(q => record(q.id).due && record(q.id).due <= day()).sort((a,b)=>record(a.id).due.localeCompare(record(b.id).due));
const completed = list => list.filter(q=>record(q.id).status===2).length;
const log = (type,id) => {
  const today = state.activity[day()] ??= {fresh:[],review:[]};
  if (!today[type].includes(id)) today[type].push(id);
};

function setStatus(id, status) {
  const old = record(id);
  if (old.status === status) return;
  const next = {status, everSolved:old.everSolved || status===2};
  if (status===2) {
    next.stage = old.stage ?? 0;
    next.due = old.due ?? day(1);
    if (!old.everSolved) log("fresh",id);
  }
  if (status===3) { next.stage = 0; next.due = day(); }
  state.records[id] = next;
  save();
}
function review(id, remembered) {
  const old = record(id);
  const stage = remembered ? Math.min((old.stage??0)+1,4) : 0;
  const couldCount = old.due && old.due <= day();
  state.records[id] = {status:remembered?2:3,everSolved:old.everSolved||remembered,stage,due:day([1,3,7,14,30][stage])};
  if (couldCount) log("review",id);
  save();
}
function options(values, selected) {
  return values.map(([val,label])=>'<option value="'+esc(val)+'"'+(String(val)===String(selected)?' selected':'')+'>'+esc(label)+'</option>').join("");
}
function bar(value,max,label) {
  const pct = max ? Math.min(100,Math.round(100*value/max)) : 0;
  return '<div class="bar" role="progressbar" aria-label="'+esc(label)+'" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>';
}
const empty = text => '<p class="empty">'+esc(text)+'</p>';
const heading = (title, sub) => '<h1>'+title+'</h1><p class="sub">'+sub+'</p>';
const metric = (label,value,sub) => '<div class="metric"><span>'+label+'</span><b>'+value+'</b><span>'+sub+'</span></div>';
const link = q => '<a href="'+esc(q.url)+'" target="_blank" rel="noopener" title="'+(questionLinks[q.title]?'Open on LeetCode':'Find this problem on takeUforward')+'">'+esc(q.title)+'</a>';
function question(q, context) {
  const r=record(q.id);
  const controls = context==="revision"
    ? '<button data-review="'+q.id+'" data-pass="true">Recalled</button><button data-review="'+q.id+'">Retry tomorrow</button>'
    : '<select data-status="'+q.id+'" aria-label="Status for '+esc(q.title)+'">'+options(statusNames.map((s,i)=>[i,s]),r.status)+'</select>';
  const result = context==="session" ? '<label class="muted">Outcome <select data-result="'+q.id+'" aria-label="Set outcome for '+esc(q.title)+'">'+options([["","Unmarked"],["attempted","Attempted"],["solved","Solved"],["review","Needs revision"]],state.active.results[q.id]??"")+'</select></label>' : controls;
  return '<div class="row"><div class="grow">'+link(q)+'<small>'+esc(q.topic)+' · '+esc(q.section)+(context==="revision"?' · Due '+dayLabel(r.due):'')+'</small></div><span class="tag '+q.difficulty.toLowerCase()+'">'+q.difficulty+'</span>'+result+'<button data-note="'+q.id+'" aria-label="Log mistake for '+esc(q.title)+'">Log</button></div>';
}
function planQueue() {
  const groups = TOPICS.map(topic=>rows.filter(q=>q.topic===topic && record(q.id).status<2));
  return groups.flat().filter(q => !state.activity[day()]?.fresh.includes(q.id));
}

  const current=upcoming[0]?.topic ?? planQueue()[0]?.topic;

    '<div class="rows plan">'+(upcoming.length?upcoming.slice(0,5).map(q=>'<div class="row"><span class="grow">'+link(q)+'</span><button data-open-topic="'+esc(q.topic)+'">Track</button></div>').join(""):empty("No new problems queued for today."))+'</div>'+

    '<div class="top section"><span class="muted">'+today.review.length+' / '+target.review+' revisions today · '+reviews.length+' due</span><a href="#revision">Review queue</a></div>'+bar(today.review.length,target.review,"Daily revision target")+'</section>'+

    '<div class="split"><section class="card"><h2>Topic coverage</h2><div class="rows">'+TOPICS.map(t=>{const group=rows.filter(q=>q.topic===t);return '<div class="row"><button class="link grow" data-open-topic="'+esc(t)+'">'+esc(t)+'</button><span class="muted count">'+completed(group)+' / '+group.length+'</span></div>';}).join("")+'</div></section><section class="card"><h2>Interview roadmap</h2><div class="rows">'+roadmap.map(([title,summary])=>'<div class="row"><div><h3>'+title+'</h3><p class="sub">'+summary+'</p></div></div>').join("")+'</div></section></div>';

    '<section class="card section">'+(active?
      '<div class="top"><div><h2>Assessment in progress</h2><p class="sub">'+active.ids.length+' problems · '+active.minutes+' minutes</p></div><div class="timer" id="timer" aria-label="Time remaining"></div></div><div class="rows">'+active.ids.map(i=>question(rows[i],"session")).join("")+'</div><div class="top section"><span class="muted">Unmarked problems remain unchanged when the set ends.</span><button class="primary" data-finish>Finish set</button></div>':
      '<h2>Build a practice set</h2><form class="form" id="practice-form"><label>Topic<select name="topic">'+options([["","Mixed topics"],...TOPICS.map(t=>[t,t])],"")+'</select></label><label>Difficulty<select name="difficulty">'+options([["","Any difficulty"],...["Easy","Medium","Hard","Unrated"].map(d=>[d,d])],"")+'</select></label><label>Questions<input name="count" type="number" min="1" max="10" value="3" required></label><label>Minutes<input name="minutes" type="number" min="1" max="180" value="60" required></label><button class="primary">Start timer</button></form><p class="muted">Mixed sets spread questions across topics and prioritize unsolved problems.</p>')+'</section>'+
    '<section class="card section"><h2>Set history</h2><div class="rows">'+(history.map(s=>'<details class="row"><summary>'+dayLabel(s.date)+' · '+s.solved+'/'+s.ids.length+' solved · '+Math.round(s.elapsed/60)+' min'+(s.expired?' · Time expired':'')+'</summary><div class="rows">'+s.ids.map(i=>'<div class="row"><div class="grow">'+link(rows[i])+'</div><span class="muted">'+esc(({solved:"Solved",attempted:"Attempted",review:"Needs revision"})[s.results[i]]||"Unmarked")+'</span></div>').join("")+'</div></details>').join("")||empty("Completed assessments will appear here."))+'</div></section>';
}
const categories=["Pattern recognition","Edge case","Implementation","Complexity","Time management"];
function mistakes() {
  return heading("Mistake Log","Record what went wrong and what you’ll do differently on the next attempt.")+
    '<section class="card section"><div class="top"><h2>Entries · '+state.notes.length+'</h2><button class="primary" data-note="">Add mistake</button></div>'+
    '<div class="rows">'+(state.notes.slice().reverse().map(n=>'<div class="row"><div class="grow"><h3>'+link(rows[n.question])+'</h3><small>'+esc(n.category)+' · '+dayLabel(n.date)+'</small><p class="sub note">'+esc(n.note)+'</p></div><button data-edit="'+esc(n.id)+'">Edit</button></div>').join("")||empty("No mistakes logged yet. Use Log next to any problem to capture a lesson."))+'</div></section>';
}
function settings() {
  return heading("Practice Settings","Set a default pace for the semester and override it on busy days.")+
    '<section class="card section"><div class="top"><h2>Daily targets</h2><button data-target="default">Edit defaults</button></div><p class="sub">Default: '+state.targets.fresh+' first-time solves · '+state.targets.review+' reviews</p><p class="sub">Today: '+targets().fresh+' first-time solves · '+targets().review+' reviews</p><div class="form"><button data-target="today">Adjust today</button>'+(state.overrides[day()]?'<button data-reset-target>Use defaults today</button>':'')+'</div></section><p class="footer">Progress, notes and practice history are saved in this browser.</p>';
}
function render() {
  const route=location.hash.slice(1);
  mode=Object.hasOwn(screens,route)?route:"dashboard";
  document.querySelector("#crumb").textContent=screens[mode];
  document.querySelector("#date").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  document.querySelectorAll("nav a").forEach(a=>{if(a.hash==="#"+mode)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  app.innerHTML={dashboard,catalog,revision,practice,mistakes,settings,sheet:catalog}[mode]();
  if(mode==="sheet")showResults();
  updateTimer();
}
function tick() {
  const active=state.active;
  if(!active)return;
  if(Date.now()>=active.end){finish(true);return;}
  updateTimer();
}
function updateTimer() {
  const timer=document.querySelector("#timer");
  if(!timer||!state.active)return;
  const seconds=Math.max(0,Math.ceil((state.active.end-Date.now())/1000));
  timer.textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
}
function finish(expired) {
  const active=state.active;
  if(!active)return;
  const marks={attempted:1,solved:2,review:3};
  for(const [id,outcome] of Object.entries(active.results)){
    if(outcome==="attempted" && record(id).status>=2)continue;
    if(marks[outcome])setStatus(+id,marks[outcome]);
  }
  const solved=Object.values(active.results).filter(x=>x==="solved").length;
  state.sessions.push({...active,solved,expired,date:day(),elapsed:Math.round((Math.min(Date.now(),active.end)-active.start)/1000)});
  state.active=null;
  save();render();flash((expired?"Time expired. ":"Set saved. ")+solved+"/"+active.ids.length+" solved.");
}
function startSet(data) {
  const topic=data.get("topic"), difficulty=data.get("difficulty"), count=Number(data.get("count")), minutes=Number(data.get("minutes"));
  const pool=rows.filter(q=>(!topic||q.topic===topic)&&(!difficulty||q.difficulty===difficulty))
    .map(q=>({q,score:(record(q.id).status===2?1:0)+Math.random()})).sort((a,b)=>a.score-b.score).map(item=>item.q);
  if(pool.length<count){flash("Only "+pool.length+" questions match. Reduce the count or change the filters.");return;}
  const picks=[], used=new Set();
  for(const q of pool){if(picks.length===count)break;if(!topic&&used.has(q.topic))continue;picks.push(q);used.add(q.topic);}
  for(const q of pool){if(picks.length===count)break;if(!picks.includes(q))picks.push(q);}
  const start=Date.now();
  state.active={ids:picks.map(q=>q.id),results:{},start,end:start+minutes*60000,minutes};
  save();render();
}
function openTargets(kind) {
  const t=kind==="today"?targets():state.targets;
  dialog.innerHTML='<form id="targets-form" data-kind="'+kind+'"><h2>'+(kind==="today"?"Today’s targets":"Default daily targets")+'</h2>'+
    '<label>First-time solves<input type="number" min="0" max="50" name="fresh" value="'+t.fresh+'" required></label><label>Due reviews<input type="number" min="0" max="50" name="review" value="'+t.review+'" required></label>'+
    '<div class="top"><button type="button" data-close>Cancel</button><button class="primary">Save targets</button></div></form>';
  dialog.showModal();
}
function openNote(questionId, entry) {
  dialog.innerHTML='<form id="note-form" data-id="'+esc(entry?.id??"")+'"><h2>'+(entry?"Edit mistake":"Log a mistake")+'</h2>'+
    '<label>Problem<select required name="question">'+options([["","Select a problem"],...rows.map(q=>[q.id,q.topic+" · "+q.title])],entry?.question??questionId)+'</select></label>'+
    '<label>Category<select name="category">'+options(categories.map(c=>[c,c]),entry?.category??categories[0])+'</select></label>'+
    '<label>What happened and what will you change?<textarea required name="note" maxlength="3000" placeholder="I missed… Next time I’ll…">'+esc(entry?.note)+'</textarea></label>'+
    '<label><span><input name="schedule" type="checkbox" '+(entry?"":"checked")+'> Add to today’s revision queue</span></label><div class="top"><button type="button" data-close>Cancel</button><button class="primary">Save mistake</button></div></form>';
  dialog.showModal();
}
document.addEventListener("click",event=>{
  const button=event.target.closest("button");
  if(!button)return;
  const d=button.dataset;
  if("close" in d){dialog.close();return;}
  if("target" in d){openTargets(d.target);return;}
  if("note" in d){openNote(d.note);return;}
  if("edit" in d){openNote("",state.notes.find(n=>n.id===d.edit));return;}
  if("resetTarget" in d){delete state.overrides[day()];save();render();return;}
  if("openTopic" in d){
    filters={query:"",topic:d.openTopic,difficulty:"",status:"",page:0};
    if(mode==="sheet")render();else location.hash="sheet";
    return;
  }
  if("page" in d){filters.page+=Number(d.page);showResults();document.querySelector("#results").scrollIntoView({block:"start"});return;}
  if("review" in d){review(+d.review,d.pass==="true");render();flash(d.pass?"Review recorded. Next interval scheduled.":"Scheduled for tomorrow.");return;}
  if("finish" in d)finish(Date.now()>=state.active.end);
});
document.addEventListener("input",event=>{
  if(event.target.id==="query"){filters.query=event.target.value;filters.page=0;showResults();}
});
document.addEventListener("change",event=>{
  const el=event.target;
  if(["topic","difficulty","status"].includes(el.id)){filters[el.id]=el.value;filters.page=0;showResults();}
  if("status" in el.dataset){setStatus(+el.dataset.status,+el.value);if(filters.status)showResults();flash("Problem status updated.");}
  if("result" in el.dataset && state.active){
    if(Date.now()>=state.active.end){finish(true);return;}
    state.active.results[el.dataset.result]=el.value;save();
  }
});
document.addEventListener("submit",event=>{
  event.preventDefault();
  const form=event.target,data=new FormData(form);
  if(form.id==="practice-form"){startSet(data);return;}
  if(form.id==="targets-form"){
    const t={fresh:+data.get("fresh"),review:+data.get("review")};
    if(form.dataset.kind==="today")state.overrides[day()]=t;else state.targets=t;
  }
  if(form.id==="note-form"){
    const note=data.get("note").trim();
    if(!note){flash("Enter a short note before saving.");return;}
    const index=state.notes.findIndex(n=>n.id===form.dataset.id);
    const entry={id:form.dataset.id||crypto.randomUUID(),date:index<0?day():state.notes[index].date,question:+data.get("question"),category:data.get("category"),note};
    if(index<0)state.notes.push(entry);else state.notes[index]=entry;
    if(data.has("schedule")){
      const r=record(entry.question);
      state.records[entry.question]={status:3,everSolved:r.everSolved,stage:0,due:day()};
    }
  }
  dialog.close();save();render();flash(form.id==="note-form"?"Mistake saved.":"Targets updated.");
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
render();
tick();
setInterval(tick,250);
</script></body></html>
